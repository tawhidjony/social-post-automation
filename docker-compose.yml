services:
    php:
        build: ./.docker/php
        container_name: tawhidjony-php
        ports:
            - "8080:8080"
            - "5173:5173"
        volumes:
            - .:/src
        environment:
            SERVER_HOST: 0.0.0.0
            SERVER_PORT: "8080"
        stdin_open: true
        tty: true
        depends_on:
            - mysql
        networks:
            - tawhidjony

    nginx:
        build: ./.docker/nginx
        container_name: tawhidjony-nginx
        ports:
            - 8010:80
        volumes:
            - .:/src
        networks:
            - tawhidjony
        depends_on:
            - php
            - mysql
            - phpmyadmin

    mysql:
        image: mysql:8.0
        container_name: tawhidjony-mysql
        ports:
            - 3311:3306
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}

        networks:
            - tawhidjony
        volumes:
            - mysqlvol:/var/lib/mysql
            - ./.docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
            - . /scripts:/docker-entrypoint-initdb.d


    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: tawhidjony-phpmyadmin
        environment:
            # PMA_ARBITRARY: 1
            PMA_HOST: tawhidjony-mysql
            PMA_PORT: 3306
            PMA_USER: ${DB_USERNAME}
            PMA_PASSWORD: ${DB_PASSWORD}
        ports:
            - "8011:80"
        depends_on:
            - mysql
        networks:
            - tawhidjony

networks:
    tawhidjony:
        driver: bridge

volumes:
    mysqlvol:
        driver: local
